
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header-container">
            <h3 id="main-title">Introduce my self</h3>
            <button class="action-btn">🎛️ 편집</button>
        </div>

        <div class="section profile-box">
           <img src="mino.jpg" class="profile-img">

            <div class="profile-text">
                <h2>이은채</h2>
                <p>경북대학교 전자공학부</p>

                <div class="contact-info">
                    <p> 대구, 대한민국</p>
                    <p> eunchae0304@knu.ac.kr</p>
                    <p> 010-7101-8556</p>
                </div>
            </div>
        </div>

        <div class="section strength-weakness-box">
            <div class="half-box left">
                <p>+</p>
                <ul>
                    <li>긍정적이다</li>
                    <li>활동적이다</li>
                </ul>
            </div>

            <div class="half-box right">
                <p>-</p>
                <ul>
                    <li>잠이 너무 많다</li>
                </ul>
            </div>
        </div>
    </div>
    

    <section class="goal-section">
	<h2>My Goals</h2>
	<p class="goal-description">
    앞으로 이루고 싶은 목표를 체크리스트로 관리해보세요.
	</p>

	<div class="goal-input-box">
		<input
			id="goalInput"
			type="text"
			placeholder="예: JavaScript로 자기소개 페이지 완성하기"
		>
		<button id="addGoalBtn">추가</button>
	</div>

	<p id="errorMessage"></p>
	<p id="goalCount">현재 목표 0개</p>
	<ul id="goalList"></ul>
</section>

<script src="./script.js"></script>
</body>
</html>

<div class="guestbook-section">
  <h3>방명록</h3>
  
  <p id="server-msg">데이터를 불러오는 중입니다...</p>

  <p id="my-msg">아직 작성된 새 방명록이 없습니다.</p>

  <div class="write-area">
    <input type="text" id="guest-name" placeholder="이름">
    <input type="text" id="guest-msg" placeholder="응원 한마디 남겨주세요!">
    <button id="submit-btn">등록</button>
  </div>
</div>
